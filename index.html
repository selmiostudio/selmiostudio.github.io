<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Amelia & Oliver — Wedding Invitation"
  >

  <title>Amelia & Oliver | Wedding Invitation</title>

  <!-- Elegant serif -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       HERO / FIRST SCREEN
  ========================== -->

  <main class="wedding-page">

    <section class="hero" id="home">

      <!-- Decorative background -->
      <div class="hero__paper"></div>

      <!--
        Эти изображения создадим отдельно.
        Пока они могут отсутствовать — это нормально.
      -->

      <img
        class="hero__flowers hero__flowers--top"
        src="images/flowers-top.png"
        alt=""
        aria-hidden="true"
      >

      <img
        class="hero__flowers hero__flowers--left"
        src="images/flowers-left.png"
        alt=""
        aria-hidden="true"
      >

      <img
        class="hero__flowers hero__flowers--right"
        src="images/flowers-right.png"
        alt=""
        aria-hidden="true"
      >


      <!-- Small introductory text -->
      <div class="hero__intro">
        <span class="hero__line"></span>

        <p>
          WE ARE GETTING MARRIED
        </p>

        <span class="hero__line"></span>
      </div>


      <!-- Couple names -->
      <header class="hero__title">

        <span class="hero__name">
          Amelia
        </span>

        <span class="hero__ampersand">
          &
        </span>

        <span class="hero__name">
          Oliver
        </span>

      </header>


      <!-- Date -->
      <div class="hero__date">
        <span>18</span>
        <i></i>
        <span>07</span>
        <i></i>
        <span>2027</span>
      </div>


      <!-- Main composition -->
      <div class="hero__composition">

        <!-- Decorative arch -->
        <div class="hero__arch">

          <!-- Couple photograph -->
          <div class="hero__photo">

            <img
              src="images/couple-main.jpg"
              alt="Amelia and Oliver"
            >

            <div class="hero__photo-overlay"></div>

          </div>

        </div>


        <!-- Small decorative card -->
        <div class="hero__mini-card">

          <span>OUR</span>

          <strong>
            love
          </strong>

          <span>STORY</span>

        </div>


        <!-- Handwritten detail -->
        <div class="hero__signature">
          forever begins here
        </div>

      </div>


      <!-- Bottom -->
      <div class="hero__bottom">

        <p>
          JOIN US TO CELEBRATE
        </p>

        <a
          class="hero__scroll"
          href="#invitation"
          aria-label="Scroll to invitation"
        >
          <span></span>
        </a>

      </div>

    </section>


    <!-- =========================
         SECOND SECTION
         Пока оставляем минимальную
         структуру для продолжения
    ========================== -->

    <section
      class="invitation"
      id="invitation"
    >

      <div class="invitation__inner">

        <p class="section-script">
          Together with our families
        </p>

        <h2 class="section-title">
          WE INVITE YOU
          <br>
          TO CELEBRATE OUR LOVE
        </h2>

        <div class="section-divider">
          <span></span>
          <i>✦</i>
          <span></span>
        </div>

        <p class="section-text">
          We would be delighted to share
          this beautiful day with you.
        </p>

      </div>

    </section>

  </main>


  <script src="script.js"></script>

</body>
</html>
